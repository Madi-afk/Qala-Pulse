name: qalapulse
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  restart: unless-stopped
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup_env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_env.py}
      POSTGRES_DB: ${POSTGRES_DB:-qalapulse}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_BIND_PORT:-16379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: qalapulse-minio:2025-04-22-0d7408fc
    build:
      context: ./infrastructure/minio
      args:
        COMPONENT: minio
        SOURCE_COMMIT: 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/setup_env.py}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    image: qalapulse-mc:2025-08-13-7394ce0d
    build:
      context: ./infrastructure/minio
      args:
        COMPONENT: mc
        SOURCE_COMMIT: 7394ce0dd2a80935aded936b09fa12cbb3cb8096
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        attempts=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then echo "MinIO initialization timed out" >&2; exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing local/qalapulse-originals local/qalapulse-redacted
        mc anonymous set none local/qalapulse-originals
        mc anonymous set none local/qalapulse-redacted
  backend:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 15
  worker:
    <<: *backend
    depends_on:
      backend: {condition: service_healthy}
    command: ["celery", "-A", "app.workers.tasks.celery_app", "worker", "--loglevel=WARNING", "--concurrency=2"]
volumes:
  postgres-data:
  redis-data:
  minio-data:
