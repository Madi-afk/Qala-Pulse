[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qalapulse-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3", "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26", "redis>=5.2,<7", "celery[redis]>=5.4,<6",
  "minio>=7.2,<8", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "pillow>=11.1,<13", "prometheus-client>=0.21,<1",
  "opencv-python-headless==4.12.0.88", "numpy==2.2.6"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-redis", "types-Pillow"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["console/*.html", "console/*.css", "console/*.js", "console/*.svg"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL/PostGIS, Redis and MinIO"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["app/db/migrations"]
