name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build

      - run: flutter build ios --release --no-codesign

      # This archive requires signing before installation on an iPhone.
      - name: Create unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iOS-App-unsigned
          path: mobile/build/ipa/app-unsigned.ipa
          if-no-files-found: error
