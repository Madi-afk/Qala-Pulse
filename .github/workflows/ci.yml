name: QalaPulse CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AI_MODE: mock
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q -m 'not integration' --cov=app --cov-report=term-missing
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/setup_env.py
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T backend python -m app.seed
      - run: pip install -r backend/requirements.lock -e './backend[dev]'
      - run: RUN_INTEGRATION=1 pytest backend/tests/test_integration.py -q
      - if: failure()
        run: docker compose logs --tail=100 backend worker
      - if: always()
        run: docker compose down
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter build web --dart-define=API_BASE_URL=http://localhost:8000/api/v1
