name: QalaPulse CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docs/lab4/check-plugin.cjs
      - run: node docs/lab5-6/build.cjs
      - run: node docs/lab5-6/check-plugin.cjs
      - name: Recover interrupted Figma build
        run: node docs/lab5-6/check-plugin.cjs
        env:
          LAB56_LEGACY_FLOW_FAILURE: '1'
      - name: Preserve readable plugin errors
        run: node docs/lab5-6/check-plugin.cjs
        env:
          LAB56_FORCE_ERROR: '1'
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AI_MODE: mock
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q -m 'not integration' --cov=app --cov-report=term-missing
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.lock -e './backend[dev]'
      - name: Real Compose integration (PostGIS, MinIO, Redis, Celery)
        run: python scripts/run_integration.py
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter build web --dart-define=API_BASE_URL=http://localhost:8000/api/v1
